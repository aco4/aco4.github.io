<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Time</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid black; padding: 8px; text-align: left; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <label for="tableSelect">Choose a table:</label>
    <select id="tableSelect" onchange="showTable()">
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C" selected>C</option>
    </select>

    <table id="tableA" class="hidden">
        <tr><th>Column A1</th><th>Column A2</th></tr>
        <tr><td>Data A1</td><td>Data A2</td></tr>
    </table>

    <table id="tableB" class="hidden">
        <tr><th>Column B1</th><th>Column B2</th></tr>
        <tr><td>Data B1</td><td>Data B2</td></tr>
    </table>

    <table id="tableC">
        <thead>
            <tr id="tableCHead"></tr>
        </thead>
        <tbody id="tableCBody"></tbody>
    </table>

    <script>
        function showTable() {
            document.querySelectorAll('table').forEach(table => table.classList.add('hidden'));
            const selectedValue = document.getElementById('tableSelect').value;
            document.getElementById('table' + selectedValue).classList.remove('hidden');
        }

        function populateTableC(data) {
            const tableHead = document.getElementById('tableCHead');
            const tableBody = document.getElementById('tableCBody');
            tableHead.innerHTML = '';
            tableBody.innerHTML = '';

            if (data.length > 0) {
                const headers = Object.keys(data[0]);
                headers.forEach(header => {
                    let th = document.createElement('th');
                    th.textContent = header;
                    tableHead.appendChild(th);
                });

                data.forEach(row => {
                    let tr = document.createElement('tr');
                    headers.forEach(header => {
                        let td = document.createElement('td');
                        td.textContent = row[header];
                        tr.appendChild(td);
                    });
                    tableBody.appendChild(tr);
                });
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            showTable();
            fetch('https://raw.githubusercontent.com/Warzone2100/warzone2100/master/data/mp/stats/research.json')
                .then(response => response.json())
                .then(data => populateTableC(data))
                .catch(error => console.error('Error loading table C data:', error));
        });
    </script>
</body>
</html>
